@keyframes slShake{0%{transform:translate(0,0)}25%{transform:translate(-9px,5px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-5px,-4px)}100%{transform:translate(0,0)}}

#rfx{position:fixed;inset:0;z-index:90;overflow:hidden;cursor:pointer;animation:sfIn .2s ease-out both}

@keyframes swBg{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:.0}}
@keyframes swFog{0%{opacity:0;transform:translate(0,0) scale(.35)}35%{opacity:var(--o,.85)}70%{opacity:calc(var(--o,.85)*.8);transform:translate(var(--dx),var(--dy)) scale(1.15)}100%{opacity:0;transform:translate(calc(var(--dx)*1.8),calc(var(--dy)*1.8)) scale(1.6)}}
@keyframes swWisp{0%{opacity:0;transform:translateX(-12%)}40%{opacity:.8}100%{opacity:0;transform:translateX(14%)}}
@keyframes swEye2{0%{opacity:0;transform:scaleY(.05)}25%{opacity:1;transform:scaleY(1.05)}70%{opacity:.95;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.1)}}
@keyframes swTitle2{0%{opacity:0;transform:translateY(-50%) scale(1.4);letter-spacing:.55em;filter:blur(10px)}35%{opacity:1;transform:translateY(-50%) scale(1);letter-spacing:.16em;filter:none}75%{opacity:1}100%{opacity:0;filter:blur(8px)}}
@keyframes swTitle{0%{opacity:0;transform:scale(1.5);letter-spacing:.6em;filter:blur(8px)}100%{opacity:1;transform:none;letter-spacing:.16em;filter:none}}
/* 급소 찌르기 */
#rfx.wk{background:radial-gradient(circle at 50% 50%,#2a0508dd 0%,#050102f6 75%)}
#rfx.wk .tg{position:absolute;left:50%;top:46%;width:min(46vmin,260px);height:min(46vmin,260px);margin:calc(min(46vmin,260px)/-2) 0 0 calc(min(46vmin,260px)/-2);border:2px solid #ff4b5c;border-radius:50%;box-shadow:0 0 26px #ff2a4d88,inset 0 0 26px #ff2a4d44;opacity:0;animation:wkLock .55s ease-out forwards}

#rfx.wk .tg::before{left:50%;top:-14%;width:2px;height:128%;margin-left:-1px}#rfx.wk .tg::after{top:50%;left:-14%;height:2px;width:128%;margin-top:-1px}
#rfx.wk .pt{position:absolute;left:50%;top:46%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff,0 0 40px #ff2a4d;opacity:0;animation:wkPt .6s .5s ease-out forwards}

#rfx.wk .bu{position:absolute;left:50%;top:46%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ff4b5c;opacity:0;animation:wkBurst .5s var(--d) ease-out forwards}

@keyframes wkLock{0%{opacity:0;transform:scale(2.4) rotate(40deg)}60%{opacity:1;transform:scale(.95) rotate(0)}100%{opacity:1;transform:scale(.82)}}
@keyframes wkPt{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(.6)}}
@keyframes wkStab{0%{opacity:1;transform:rotate(var(--a)) scaleY(0)}45%{opacity:1;transform:rotate(var(--a)) scaleY(1)}100%{opacity:0;transform:rotate(var(--a)) scaleY(1)}}
@keyframes wkBurst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(6)}}

#rfx.ft .th{position:absolute;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,#ffd34d,transparent);opacity:0;box-shadow:0 0 12px #ffb300;animation:ftTh 1.1s var(--d) ease-in-out forwards}
#rfx.ft .sc{position:absolute;left:50%;top:44%;width:0;height:0;perspective:700px}
#rfx.ft .cu{position:absolute;width:min(30vmin,170px);height:min(30vmin,170px);margin:calc(min(30vmin,170px)/-2) 0 0 calc(min(30vmin,170px)/-2);transform-style:preserve-3d;animation:ftTumble 1.05s cubic-bezier(.2,.7,.25,1) forwards}
#rfx.ft .fc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(26vmin,150px);line-height:1;color:#2a1600;background:linear-gradient(135deg,#fff3c4,#ffd34d 55%,#c98a00);border:2px solid #fff3c4;border-radius:14px;box-shadow:inset 0 0 22px #fff7;backface-visibility:visible}

/* ===== UI 개선 (v2): 어두운 판타지 톤 · 둥근 모서리 · 은은한 광택 · 부드러운 반응 ===== */
:root{--bg:#0d1310;--panel:#17211c;--ink:#f1ead2;--line:#b9a15c;--hp:#6fd27a;--mp:#6aa9e6;--gold:#e8cf86;--gold2:#b8993f;--edge:#2c3a31}
html{color-scheme:dark}
body{background:radial-gradient(1200px 700px at 50% -10%,#1d2c24 0%,#0d1310 60%) fixed,var(--bg);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
#app{gap:9px;position:relative}
/* 이동 창: 메뉴 줄 바로 아래에 메인 화면 위로 펼쳐진다 */
#panel.drop{position:absolute;left:10px;right:10px;z-index:20;min-height:0;box-shadow:0 14px 34px #000d,0 0 0 1px #b9a15c55;background:linear-gradient(#1d2b24,#121a16);transform-origin:50% 0}
.row button.on,.tgl.on{background:linear-gradient(#2a3a30,#18241d);color:var(--gold);border:2px solid #ffe08a;padding:5px 11px;box-shadow:0 0 0 2px #ffe08a33,0 0 12px #ffd34d77,inset 0 3px 8px #000a}
#bar button.on{background:linear-gradient(#2a3a30,#18241d);color:var(--gold);border:2px solid #ffe08a;padding:6px 13px;box-shadow:0 0 0 3px #ffe08a33,0 0 16px #ffd34d88,inset 0 3px 8px #000a;transform:translateY(1px);position:relative}
#bar button.on::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:7px solid #ffe08a;filter:drop-shadow(0 0 4px #ffd34d)}
#b-ham{display:none}
@media(max-width:640px){
 #b-ham{display:inline-block;min-width:46px;font-size:20px;line-height:1;padding:6px 14px;text-align:left}
 #b-ham.on{background:linear-gradient(#2a3a30,#18241d);color:var(--gold);border:2px solid #ffe08a;padding:5px 13px;box-shadow:0 0 0 2px #ffe08a33,0 0 12px #ffd34d77,inset 0 3px 8px #000a}
 #bar>button:not(#b-ham):not(#b-set){display:none}
 #bar.mopen>button:not(#b-ham):not(#b-set){display:inline-block;animation:hamIn .2s ease-out both}
 #bar.mopen>#b-inv{margin-left:0!important}
}
@keyframes hamIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#panel.dropin{animation:dropIn .32s cubic-bezier(.2,.9,.25,1) both}
@keyframes dropIn{0%{opacity:0;transform:translateY(-16px) scaleY(.92)}60%{opacity:1}100%{opacity:1;transform:none}}
button{border-radius:7px;background:linear-gradient(#ecd68f,#bf9f45);color:#241c07;box-shadow:0 1px 0 #fff6 inset,0 2px 5px #0006;transition:filter .12s,transform .08s,box-shadow .12s;border:1px solid #8f7630}
button:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 1px 0 #fff7 inset,0 3px 9px #0008}
button:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
#bar{gap:7px}
#bar button{padding:7px 14px;letter-spacing:.03em}
#b-set{background:linear-gradient(#2d3b33,#1c2722);color:var(--gold);border:1px solid var(--line)}
#setm{background:linear-gradient(#1c2620,#121a15);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 28px #000c}
#setm button{border-radius:0;background:transparent;color:var(--ink);box-shadow:none;border:0;border-bottom:1px solid #b9a15c33}
#setm button:hover:not(:disabled){background:#2b3a31;filter:none;box-shadow:none}
#hud{padding:2px 4px;color:var(--gold);text-shadow:0 1px 0 #000a}
#pbar,#foebar,#qbar,#lqbar,#panel,.lp,.mvg,#panel .sc,#panel .cc{border-radius:10px}
#pbar{background:linear-gradient(#1c2a23,#141d18);border:1px solid var(--line);box-shadow:0 1px 0 #ffffff10 inset,0 4px 14px #0008;padding:8px 12px}
#foebar{background:linear-gradient(#2a1c1c,#1a1212);border:1px solid #b6665d;box-shadow:0 1px 0 #ffffff10 inset,0 4px 14px #0008;padding:8px 12px}
#qbar{background:linear-gradient(#2a2316,#18140c);border:1px solid #ffb347;box-shadow:0 4px 12px #0007}
#lqbar{background:linear-gradient(#2c1f12,#1a1109);border:1px solid #ff9a2e;box-shadow:0 4px 12px #0007}
.hb{height:11px;border-radius:7px;background:#04070599;border:1px solid #ffffff22;overflow:hidden;box-shadow:0 1px 3px #000a inset}
.hb i{border-radius:7px;background:linear-gradient(#a5f0ae,#4fb85c);box-shadow:0 0 8px #6fd27a55;transition:width .35s ease}
#pbar .hb i.m{background:linear-gradient(#a6d3ff,#4a8fd0);box-shadow:0 0 8px #6aa9e655}
#foebar .hb i{background:linear-gradient(#ff9a8f,#d04a3e);box-shadow:0 0 8px #ff6a5a55}
.hb{position:relative}.hb i{position:relative;z-index:1}.hb u.tr{position:absolute;left:0;top:0;bottom:0;border-radius:7px;z-index:0;text-decoration:none}
.hb u.tr.dn{background:linear-gradient(#fff3c4,#ffb95a)}.hb u.tr.up{background:linear-gradient(#e6fff0,#8ff0a8);opacity:.75}
.hb.fl-dn{animation:hbDn .5s ease-out}.hb.fl-up{animation:hbUp .7s ease-out}
@keyframes hbDn{0%{box-shadow:0 0 0 2px #ff6a5acc,0 0 14px #ff6a5a,0 1px 3px #000a inset;transform:translateX(-2px)}25%{transform:translateX(2px)}50%{transform:translateX(-1px)}100%{box-shadow:0 1px 3px #000a inset;transform:none}}
@keyframes hbUp{0%{box-shadow:0 0 0 2px #8ff0a8cc,0 0 16px #8ff0a8,0 1px 3px #000a inset}100%{box-shadow:0 1px 3px #000a inset}}
#foebar{position:relative}
#foebar.kill{animation:foeKill .7s ease-in both;transform-origin:50% 50%}

.cd{width:25px;height:25px;transition:background .25s,box-shadow .25s}

@keyframes cdGain{0%{transform:scale(.3);box-shadow:0 0 0 0 #9fd4ffcc}55%{transform:scale(1.35);box-shadow:0 0 0 7px #6aa9e655,0 0 18px #bfe0ff}100%{transform:scale(1)}}
@keyframes cdLose{0%{transform:scale(1.25);background:radial-gradient(circle at 35% 30%,#ffe0d4,#ff6a5a);box-shadow:0 0 14px #ff6a5a}100%{transform:scale(1);background:transparent}}

/* ===== 플레이트 상태/속성 연출 ===== */
#pbar,#foebar{position:relative;isolation:isolate}
.sfx{position:absolute;inset:0;mix-blend-mode:screen;border-radius:inherit;pointer-events:none;z-index:-1;overflow:hidden;animation:sxPulse 2.4s linear infinite}
.sfx::before,.sfx::after{content:"";position:absolute;pointer-events:none;animation-delay:inherit;animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes sxPulse{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes sxFast{0%,100%{opacity:.3}25%{opacity:.8}50%{opacity:.35}75%{opacity:.75}}
@keyframes sxFlame{0%,100%{transform:scaleY(.8) translateX(0);opacity:.4}25%{transform:scaleY(1.1) translateX(3px);opacity:.75}50%{transform:scaleY(.9) translateX(-2px);opacity:.5}75%{transform:scaleY(1.15) translateX(2px);opacity:.8}}
@keyframes sxRise{to{background-position:0 -34px,12px -9px}}
@keyframes sxSlide{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes sxFloat{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes sxTw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes sxDrip{from{transform:translateY(0)}to{transform:translateY(50%)}}
.sfx-burn{box-shadow:inset 0 0 12px #ff6a1f99,inset 0 -16px 20px -8px #ff4a10aa}
.sfx-burn::before{left:0;right:0;bottom:0;height:75%;background:radial-gradient(ellipse at 15% 100%,#ffb347cc,transparent 55%),radial-gradient(ellipse at 50% 100%,#ff5a1fcc,transparent 60%),radial-gradient(ellipse at 85% 100%,#ffd34dcc,transparent 50%);transform-origin:50% 100%;animation-name:sxFlame;animation-duration:1.2s}
.sfx-poison,.sfx-disease,.sfx-corrode{box-shadow:inset 0 0 14px #5fe05a88}
.sfx-poison::before,.sfx-disease::before,.sfx-corrode::before{inset:0;background:radial-gradient(circle,#8dff7a88 0 3px,transparent 4px) 0 0/34px 34px,radial-gradient(circle,#5fd05a88 0 2px,transparent 3px) 12px 17px/26px 26px;animation-name:sxRise}
.sfx-disease{box-shadow:inset 0 0 14px #b8c24a88}.sfx-disease::before{filter:hue-rotate(-50deg)}
.sfx-corrode{box-shadow:inset 0 0 14px #d8e63a88}.sfx-corrode::before{filter:hue-rotate(-30deg) saturate(1.4)}
.sfx-bleed{box-shadow:inset 0 0 14px #d0101a99}
.sfx-bleed::before{left:0;right:0;top:-100%;height:200%;background:repeating-linear-gradient(90deg,transparent 0 26px,#c4121cbb 26px 29px);-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);animation-name:sxDrip}
.sfx-chill{box-shadow:inset 0 0 18px 4px #bfe9ffcc,inset 0 0 44px #6ab8ff66}
.sfx-chill::before{inset:0;background:linear-gradient(135deg,#e8f8ffcc 0,transparent 20%),linear-gradient(-45deg,#e8f8ffcc 0,transparent 20%),linear-gradient(45deg,#cfeeffaa 0,transparent 14%),linear-gradient(-135deg,#cfeeffaa 0,transparent 14%);animation-name:sxPulse}
.sfx-chill::after{inset:0;background:radial-gradient(circle,#fff 0 1.5px,transparent 2.5px) 0 0/46px 30px,radial-gradient(circle,#dff4ff 0 1px,transparent 2px) 20px 14px/38px 26px;animation-name:sxTw;animation-duration:1.2s}
.sfx-freeze{background:linear-gradient(120deg,#9fdcff66,#e6f7ff99 45%,#9fdcff66);box-shadow:inset 0 0 22px 6px #e6f7ffdd}
.sfx-freeze::before{top:0;bottom:0;left:0;width:50%;background:linear-gradient(105deg,transparent 30%,#ffffffcc 50%,transparent 70%);animation-name:sxSlide;animation-duration:2.4s}
.sfx-shock{box-shadow:inset 0 0 10px 2px #ffe94dcc;animation-name:sxFast;animation-duration:.6s}
.sfx-shock::before{inset:0;background:repeating-linear-gradient(115deg,transparent 0 38px,#fff48acc 38px 40px,transparent 41px 86px);animation-name:sxFast;animation-duration:.8s}
.sfx-stun{box-shadow:inset 0 0 0 2px #ffd34d99}
.sfx-stun::before{inset:0;background:repeating-linear-gradient(45deg,#ffd34d33 0 10px,transparent 10px 20px);background-size:28px 28px;animation-name:sxFast}
.sfx-sleep{background:#1a2a6a55;box-shadow:inset 0 0 18px #4a6ae088}
.sfx-sleep::after{right:10px;bottom:4px;content:"💤";font-size:18px;animation-name:sxFloat}
.sfx-charm{box-shadow:inset 0 0 16px 2px #ff7fd0aa}
.sfx-charm::after{left:12px;bottom:4px;content:"💗";font-size:16px;animation-name:sxFloat}
.sfx-fear{box-shadow:inset 0 0 30px 8px #2a0a4add;animation-name:sxFast;animation-duration:1.2s}
.sfx-curse{box-shadow:inset 0 0 18px #9b4dffaa}
.sfx-curse::before{inset:0;background:radial-gradient(ellipse at 30% 85%,#5b1a9a99,transparent 60%),radial-gradient(ellipse at 75% 15%,#3a0a6a99,transparent 55%);animation-name:sxPulse}
.sfx-wound{box-shadow:inset 0 0 14px #8a2a2aaa}
.sfx-wound::before{inset:0;background:repeating-linear-gradient(135deg,#ffffff14 0 8px,transparent 8px 16px)}
.sfx-dazzle{box-shadow:inset 0 0 26px 8px #fffbd0dd;animation-name:sxFast;animation-duration:1.2s}
/* 속성 공격 1회성 연출 */
.pbst{position:fixed;z-index:80;pointer-events:none;border-radius:10px;overflow:hidden;animation:pbFade 1s ease-out both}
@keyframes pbFade{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
.pbst .pp{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:18px;animation:ppPop .8s ease-out both}
@keyframes ppPop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(1) translateY(-10px);opacity:0}}
@keyframes ppRise{0%{transform:translateY(24px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes ppFall{0%{transform:translateY(-26px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes ppSweep{0%{transform:translateX(-30px) rotate(0);opacity:0}30%{opacity:1}100%{transform:translateX(40px) rotate(360deg);opacity:0}}
.pbst-fire{background:radial-gradient(ellipse at 50% 120%,#ff7a1fdd,#ffb34766 45%,transparent 75%);box-shadow:inset 0 0 20px #ff6a1f}.pbst-fire .pp{animation-name:ppRise}
.pbst-water{background:linear-gradient(180deg,transparent,#3a8aff88);box-shadow:inset 0 0 20px #4aa8ff}.pbst-water .pp{animation-name:ppFall}
.pbst-bolt{background:#fff6a8aa;box-shadow:inset 0 0 22px #ffe94d;animation-name:pbFlash;animation-duration:.7s}
@keyframes pbFlash{0%,30%,60%{opacity:1}15%,45%,100%{opacity:.1}}
.pbst-earth{background:linear-gradient(180deg,transparent,#8a5a2a99);box-shadow:inset 0 0 18px #8a5a2a}.pbst-earth .pp{animation-name:ppFall}
.pbst-wind{background:linear-gradient(100deg,transparent 20%,#bff5c9aa 50%,transparent 80%);background-size:200% 100%;box-shadow:inset 0 0 16px #8fe6a8;animation-name:pbFade}.pbst-wind .pp{animation-name:ppSweep}
.pbst-light{background:radial-gradient(circle,#fffbe0dd,transparent 75%);box-shadow:inset 0 0 26px #fffbd0}
.pbst-dark{background:radial-gradient(circle,#2a0a4aee,#0a0014cc);box-shadow:inset 0 0 24px #7a3ad0}
.pbst-poison{background:radial-gradient(ellipse at 50% 100%,#5fe05aaa,transparent 70%);box-shadow:inset 0 0 18px #5fe05a}.pbst-poison .pp{animation-name:ppRise}

/* ===== 네임드 속성 스킬 연출 (#skfx) ===== */
#skfx{position:fixed;z-index:85;border-radius:10px;overflow:hidden;cursor:pointer;animation:skIn .18s ease-out both;box-shadow:0 0 0 2px var(--c),0 0 24px var(--c)}
#skfx.out{animation:skOut .22s ease-in both}
@keyframes skIn{from{opacity:0}to{opacity:1}}@keyframes skOut{to{opacity:0}}
#skfx .bg{position:absolute;inset:0;animation:skBg 1.5s ease-out both}
@keyframes skBg{0%{opacity:0}15%{opacity:1}75%{opacity:.9}100%{opacity:.5}}
#skfx .p{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:clamp(20px,6vmin,34px);opacity:0;filter:drop-shadow(0 0 6px var(--c))}
#skfx .cap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 10px;animation:skCap 1.5s ease-out both}
#skfx .ct{font-size:clamp(20px,6.4vw,38px);font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 8px var(--c),0 0 22px var(--c),0 2px 4px #000;word-break:keep-all}
#skfx .cs{margin-top:6px;font-size:12.5px;color:#fff;opacity:.9;text-shadow:0 1px 3px #000;word-break:keep-all}
@keyframes skCap{0%{opacity:0;transform:translateY(-50%) scale(1.6)}22%{opacity:1;transform:translateY(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes skShot{0%{opacity:0;transform:translateX(calc(var(--w)*-.4))}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(calc(var(--w)*1.1))}}
@keyframes skBurst{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
@keyframes skFall{0%{opacity:0;transform:translateY(calc(var(--h)*-.5))}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--h)*.7))}}
@keyframes skRise{0%{opacity:0;transform:translateY(calc(var(--h)*.5))}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--h)*-.7))}}
@keyframes skShake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
#skfx.skm-shot .p{animation:skShot .9s ease-in both}
#skfx.skm-slam .p{left:50%;top:50%;animation:skBurst .9s ease-out both}
#skfx.skm-slam{animation:skIn .18s ease-out both,skShake .35s .25s 2}
#skfx.skm-wave .p{animation:skFall 1.1s ease-in both}
#skfx.sk-fire.skm-wave .p{animation-name:skRise}#skfx.sk-wind.skm-wave .p{animation-name:skShot}
#skfx.skm-slam .bg::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid var(--c);animation:skRing .8s .2s ease-out both}
@keyframes skRing{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(30)}}
.sk-fire .bg{background:radial-gradient(ellipse at 50% 120%,#ff7a1fee,#c2330066 55%,#1a0600dd)}
.sk-water .bg{background:linear-gradient(180deg,#06204acc,#1c6ad0aa 60%,#7fd0ff88);}
.sk-water .bg::before{content:"";position:absolute;left:-50%;right:-50%;top:35%;height:80%;background:radial-gradient(ellipse at 50% 0,#bfe8ffaa 0 40%,transparent 41%) 0 0/60px 40px repeat-x;animation:skWave 1s linear infinite}
@keyframes skWave{to{transform:translateX(-60px)}}
.sk-bolt .bg{background:radial-gradient(circle,#fff6a8cc,#2a2a6acc 80%);animation:skStrobe .6s steps(1) 2 both}
@keyframes skStrobe{0%{opacity:1}20%{opacity:.15}40%{opacity:1}60%{opacity:.25}80%{opacity:.9}100%{opacity:.7}}
.sk-earth .bg{background:linear-gradient(180deg,#2a1808dd,#8a5a2aaa)}
.sk-wind .bg{background:linear-gradient(100deg,#0a2a1ecc 10%,#8fe6c0aa 50%,#0a2a1ecc 90%);background-size:200% 100%;animation:skBg 1.5s ease-out both,skSweep 1s linear infinite}
@keyframes skSweep{to{background-position:-200% 0}}
.sk-light .bg{background:radial-gradient(circle,#fffbe0,#ffe68099 50%,#6a4a0099)}
.sk-dark .bg{background:radial-gradient(circle at 50% 50%,#2a0a4a00 0,#1a0830cc 45%,#05000ae6 100%)}

function dexMenu(tab,cat,idx){if(typeof tab!=="string")tab="el";
 const nav=["<i class='dl'></i>",[["el","속성"],["nm","네임드"],["drop","드랍"],["job","직업"],["item","아이템"],["ench","마법부여"],["world","세계관"]].map(([k,t])=>[(tab===k?"▶":"")+t,()=>dexMenu(k,null,0)])];
 if(tab==="nm")return dexNamed(nav,cat,idx);
 if(tab==="world")return dexWorld(nav);
 if(tab==="ench")return dexEnch(nav);
 if(tab==="job")return dexJob(nav);
 if(tab==="item")return dexItem(nav);
 if(tab==="drop")return dexDrop(nav,cat,idx);
 const intro=`<b>🌍 원소의 세계</b><br>이 세계의 모든 힘은 여덟 가지 원소 — <b>불·물·땅·바람·빛·어둠·번개·독</b> — 에서 비롯된다고 전해진다. 몬스터는 자신과 어울리는 속성의 힘을 지니고(속성이 없는 몬스터도 있다), 그 힘으로 <b>속성 스킬</b>을 쓴다. 피해는 세 가지다. <b>일반 피해</b>(평타)는 내 <b>방어력</b>으로, <b>속성 피해</b>(속성 스킬)는 해당 속성의 <b>저항력</b>으로 줄어든다(속성 피해에는 방어력이 적용되지 않는다). <b>고유 피해</b>는 방어력도 저항력도 통하지 않는다. 네임드의 고유 스킬은 고유 피해를 중심으로 속성 피해·일반 피해가 섞인다. 속성 스킬은 속성에 어울리는 <b>상태이상</b>을 동반한다. 네임드(던전 간부·보스, 필드 희귀)는 <b>평타도</b> 10~20% 확률로 자신의 속성에 맞는 상태이상을 건다(네임드마다 다르며 몬스터 정보에 표시) — 화상 중 불 속성 공격, 눈부심 중 빛 속성 공격처럼 상태이상과 같은 속성의 공격이 이어지면 약점 피격이 된다. <b>한기</b>가 2중첩되면 <b>🧊빙결</b>에 걸려 몬스터가 행동권을 2번 쓸 때까지 행동할 수 없고, 이 동안 물 속성 공격에 약점 피격(+30%)을 입는다.<br><small style="opacity:.85">· 속성 스킬과 네임드의 고유 스킬은 한 번 쓰면 ${SKILL_CD}턴 동안 다시 쓸 수 없다. · 고유 스킬은 네임드만 지니며 최대 3개 속성을 품는다. · 일부 고유 스킬은 몬스터의 행동권 2개를 연속으로 써야 발동한다 — 그 사이 내가 행동권을 빼앗으면 저지된다. · 속성 몬스터는 자신을 강화하는 버프 스킬(공격력↑·방어력↑·회복·보호막)도 쓴다. · 몬스터가 드랍하는 장비 중 공격력이 붙는 장비(무기·보조장비·목·손가락·장신구)에는 그 몬스터의 속성이 붙을 수 있다(등급이 높을수록 확률이 높다). 이때 장비의 주스탯(공격력)은 그대로이고, 별도의 <b>보조효과 '속성 공격력'</b>(장비 레벨 × ${f(EA_V[0])}~${f(EA_V[1])})이 붙는다. 이 수치는 그 속성의 공격력(속성 공격력)으로 합산되며 총 공격력에도 포함된다. 평타·강타·스킬·착용효과·패시브 등 몬스터에게 가하는 모든 피해는 <b>공격력(속성 제외) + 속성 공격력</b>으로 계산되고, 속성 부분에만 아래 규칙이 적용된다. 속성은 전투 중에 고르지 않으며 착용한 장비의 속성이 모두 동시에 적용된다. 치명타율은 70%가 상한이고 넘은 만큼은 <b>특화</b>가 된다(초과 1%당 특화 10, 특화 1당 속성 공격력 +1 — 보유한 속성에 비율대로 분배되고, 속성 공격력이 없으면 일반 공격력 +1). 상태창에는 속성 공격력이 <b>100(장비 80 + 특화 20)</b>처럼 표기된다. 같은 속성 몬스터에게는 50% 확률로 면역, 50% 확률로 피해 절반이며 약점 속성에는 피해 +30%다. 약점 관계는 불←물←번개←바람←땅←독←불 (A←B는 A 속성 몬스터가 B 속성에 약하다는 뜻)과 빛↔어둠이다. 속성 공격력이 있는 속성마다 공격할 때(여러 번 타격하는 스킬은 타격마다 따로) 15% 확률로 효과가 발동한다 — 불: 화상, 물: HP 회복, 땅: 기절, 바람: 연계점수, 빛: 보호막(보호막이 있으면 빛 공격 폭발 +20%), 어둠: 랜덤 저주(저주 중인 몬스터에게 약점), 번개: 감전(감전 중인 몬스터에게 약점), 독: 중독. 화상 중인 몬스터는 불 공격에 약점이다. 착용효과 독·화상 피해는 각각 독·불 속성이다. · 장비 착용효과는 상태이상의 확률·효과와 별개로 동작한다.</small>`;
 panel("📖 도감",[nav]);const root=$("panel");
 root.append(secEl("🌍 원소의 세계",intro));
 root.append(secEl("🔮 속성 <small style='opacity:.75'>(8종)</small>",cardGrid(Object.entries(ELEM).map(([k,e])=>({col:e.c,html:`<div style="font-size:15px">${eTag(k)}</div><div style="font-size:12.5px;margin-top:2px">${e.d}</div><div style="font-size:12px;opacity:.85;margin-top:3px">동반 상태이상: ${e.s}</div><div style="font-size:12px;opacity:.85">몬스터 특성: ${traitTxt(k)}</div><div style="font-size:12px;opacity:.85;color:#9be3a8">속성 공격력이 있을 때 효과: ${EL_FX[k]}</div>`})))));
 root.append(secEl("⚠ 상태이상 <small style='opacity:.75'>(확률은 스킬마다 다를 수 있다)</small>",cardGrid(STS_ORDER.map(k=>{const S=STS[k];return {col:"#e0a040",html:`<div>${S.i} <b>${S.n}</b> <small style="opacity:.8">(기본 ${pc(S.p)}%)</small></div><div style="font-size:12.5px;margin-top:2px;opacity:.9">${S.d}</div>`}}))));
 root.append(secEl("🛡 영웅 네임드 물리 방어",`<div style="font-size:12.5px;line-height:1.6">영웅 난이도의 네임드(필드 희귀·영웅 / 던전 간부·보스)가 받는 물리 피해 감소는 최대 <b>${HPD_CAP*100}%</b>까지다. 방어력이 높거나 방어력 강화로 이 한도를 넘으면 몬스터가 <b>🛡 물리피해 확정 방어</b> 버프를 얻어, 내 <b>다음 물리 피해(속성 피해 제외)를 전부 막는다</b>. 버프는 몬스터 플레이트에 표시되고 한 번 막으면 사라지며, 이후 ${PG_CD}턴 동안은 다시 생기지 않는다. 주문 피해는 방어력을 무시하므로 영향이 없다.</div>`));

const WORLD=[["0. 한 줄 요약", "<p class=\"wp\">세계는 여덟 원소가 서로를 지키기로 한 오래된 <b>맹약<\/b> 위에 서 있습니다. 북쪽에서 번지는 어둠(마기)의 뿌리를 따라가던 모험가는 마왕성에서 첫 번째 진실을 마주하고, 그 진실은 그를 더 깊은 숲 — 대수림으로 이끕니다.<\/p>"], ["1. 세계 개요", "<div class=\"wl\">· <b>대륙:<\/b> 에이렌 대륙. 남쪽 끝의 평화로운 초원에서 시작해 북쪽으로 갈수록 땅이 병들고 어두워집니다. 초원 → 숲 → 늪 → 산맥 → 망자의 땅 → 마왕성이 곧 남에서 북으로 가는 길입니다. 마왕성 너머 동쪽에는 엘프의 고향 <b>대수림<\/b>이 있습니다.<\/div><div class=\"wl\">· <b>시작 마을:<\/b> 로웬. 대륙 최남단의 작은 마을이며 모험가 등록소가 있습니다.<\/div><div class=\"wl\">· <b>시대:<\/b> 맹약력 612년. 오랫동안 평화로웠지만 최근 몇 해 사이 북쪽에서 이상하게 변한 짐승과 괴물이 남쪽으로 내려오기 시작했습니다.<\/div><div class=\"wl\">· <b>분위기:<\/b> 정통 중세 판타지. 따뜻한 출발 → 점점 불길해지는 여정 → 마왕성의 반전 → 숲 속에서 이어지는 또 하나의 비극.<\/div><div class=\"wh\">지역 구분<\/div><div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>권역<\/th><th>해당 필드<\/th><th>분위기<\/th><\/tr><tr><td>프리아 평원<\/td><td>초원 어귀 · 황금 들판 · 고블린 구릉<\/td><td>평화로운 농경지. 가벼운 위협<\/td><\/tr><tr><td>엘더 숲<\/td><td>푸른 숲 어귀 · 속삭이는 숲 · 고목의 심장부<\/td><td>오래된 숲, 요정과 마녀<\/td><\/tr><tr><td>묵은 늪<\/td><td>안개 습지 · 썩은 수렁 · 저주받은 갈대밭<\/td><td>부패와 저주의 시작<\/td><\/tr><tr><td>철각 산맥<\/td><td>바위 고원 · 광산 갱도 · 용의 능선<\/td><td>드워프와 용, 거대한 힘<\/td><\/tr><tr><td>어둠의 땅<\/td><td>망자의 평원 · 피의 성채 외곽 · 공허의 문턱<\/td><td>죽음, 피, 그리고 공허<\/td><\/tr><tr><td>벨라드 고성<\/td><td>(던전) 마왕성<\/td><td>1막의 종착점<\/td><\/tr><tr><td>대수림<\/td><td>수림의 관문 · 은월의 숲 · 가시 덩굴 미궁 · 세계수의 뿌리 · 타락한 성소<\/td><td>엘프의 숲. 마기에 물든 신성한 땅 (2막)<\/td><\/tr><\/table><\/div>"], ["2. 세계의 이치", "<div class=\"wh\">2-1. 여덟 원소와 맹약<\/div><p class=\"wp\">태초에 불·물·땅·바람·번개·빛·어둠·독의 여덟 원소가 있었고, 각 원소를 대표하는 수호자들이 서로의 영역을 침범하지 않기로 약속했습니다. 이것이 <b>「여덟 원소의 맹약」<\/b> 입니다. 불은 물에 약하고 번개는 땅에 흩어지듯, 원소끼리 서로를 누르고 받아내는 이치가 맹약 덕분에 질서로 남았습니다. 독은 어둠에서 갈라져 나온 \"썩음의 원소\"라 가장 늦게 맹약에 들었습니다.<\/p><div class=\"wh\">2-2. 사람이 오를 수 있는 길과 그 끝<\/div><p class=\"wp\">수련과 위업을 쌓은 사람은 한 걸음씩 더 강해집니다. 학파들은 그 길을 문(門)에 비유해 가르치고, 어느 학파의 교본에도 <b>\"사람의 길은 여섯 번째 문에서 끝난다\"<\/b> 고 적혀 있습니다. 그 너머에 대해서는 아무도 가르치지 않습니다. 사람들은 이를 자연이 정한 한계라 믿어 왔습니다. 이것이 1막 전체를 관통하는 첫 번째 의문입니다.<\/p><div class=\"wl\">· 한계에 이른 모험가는 더 이상 경험으로 크게 변하지 않고, 대신 장비와 기술로 더 높은 곳을 노립니다.<\/div><div class=\"wl\">· 길의 중간마다 학파가 제자를 받는 시기가 있습니다. 전직 교관들은 한계에 가까워진 자에게만 마지막 비전을 전합니다.<\/div><div class=\"wh\">2-3. 싸움의 기세<\/div><p class=\"wp\">맞서는 두 존재는 서로의 숨과 걸음을 읽으며 <b>기세<\/b>를 다툽니다. 먼저 틈을 잡은 쪽이 공격하고, 잡지 못한 쪽은 막거나 피하는 데 급급합니다. 기세가 한쪽으로 오래 쏠리면 호흡이 이어져 더 큰 기술을 낼 힘이 몸에 쌓입니다. 노련한 모험가는 이 흐름을 읽어 상대의 기세를 끊고, 도적들의 비전 <b>운명의 지배<\/b>는 그 흐름 자체를 비트는 위험한 기술로 전해집니다.<\/p><div class=\"wl\">· 이 이치를 따르지 않는 존재가 있습니다. 공허 쪽의 괴물들은 기세가 요동치고 호흡이 어긋나 상대하기 훨씬 까다롭습니다. (후반 복선)<\/div><div class=\"wh\">2-4. 쓰러진 모험가는 어떻게 돌아오는가<\/div><p class=\"wp\">모험가 등록소는 대륙 모든 마을에 <b>구조 사제단<\/b>을 두고 있습니다. 모험가가 등록하면 사제단의 <b>귀환석<\/b> 한 조각을 받는데, 쓰러지면 이 귀환석이 사제단에 신호를 보내 몸을 마을 여관으로 옮깁니다.<\/p><div class=\"wl\">· 구조와 수습, 치료 비용으로 <b>재산의 절반<\/b>이 사제단에 넘어갑니다. 그래서 \"재산을 다 들고 가다 쓰러지면 반이 날아간다\"는 말이 모험가 사이의 격언이 되었습니다.<\/div><div class=\"wl\">· 던전의 어둠은 귀환석의 신호를 막아, 던전에서 쓰러지면 깊은 곳에서 쫓겨나 처음부터 다시 도전해야 합니다.<\/div><div class=\"wl\">· 여관의 휴식 요금은 사제단이 치료사를 부르는 값입니다.<\/div><div class=\"wh\">2-5. 장비는 왜 몬스터에게서 나오는가<\/div><p class=\"wp\">몬스터는 대부분 <b>오염 이전에 실종된 모험가·병사·상인의 물건<\/b>을 몸에 두르거나 둥지에 쌓아 둡니다. 강한 괴물일수록 좋은 물건을 모으는 습성이 있습니다. 장비의 격(평범한 것 → 이름난 것 → 전설)은 그 주인이 쌓은 위업의 무게입니다.<\/p><div class=\"wl\">· 이것이 뒤에 나올 \"첫 번째 원정대의 흔적\"과 이어집니다.<\/div><div class=\"wl\">· 소문난 장인이 만든 걸작 중에는 <b>전설<\/b>이라 불리는 것이 있습니다. 필살의 비수가 그 첫 번째 사례입니다.<\/div><div class=\"wh\">2-6. 이름의 힘 (희귀 네임드와 인장)<\/div><p class=\"wp\">오염을 받은 짐승과 존재 중 일부는 <b>이름을 얻고<\/b> 격이 올라갑니다. 이름 있는 존재는 자신을 증명하는 <b>인장<\/b>(앞니, 뿔, 고삐, 두개골 같은 몸의 일부)을 몸에 지닙니다.<\/p><div class=\"wl\">· 인장을 <b>다섯 개<\/b> 모아 의식을 올리면 그 이름을 정식으로 불러낼 수 있고, 부름을 받은 존재가 나타납니다.<\/div><div class=\"wl\">· 일반 괴물이 인장을 떨어뜨리는 것은 같은 땅에 사는 이름 있는 존재의 인장 조각을 부하들이 주워 지니기 때문입니다.<\/div><div class=\"wl\">· 인장을 너무 많이 지니면 그 무게에 사람이 짓눌립니다. 그래서 한 사람이 가질 수 있는 양에는 자연스러운 한도가 있습니다.<\/div>"], ["3. 역사 연표", "<div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>시기<\/th><th>사건<\/th><\/tr><tr><td>태초<\/td><td>여덟 원소의 수호자가 맹약을 맺음<\/td><\/tr><tr><td>맹약력 이전 수백 년<\/td><td>용의 시대. 철각 산맥에 용이 군림하고, 이후 드워프와 인간이 용을 몰아냄<\/td><\/tr><tr><td>맹약력 1~300년<\/td><td>인간 왕국들의 시대. 모험가 제도가 생김<\/td><\/tr><tr><td><b>맹약력 300년경<\/b><\/td><td>북쪽으로 <b>첫 번째 모험가 원정대<\/b>가 출발해 돌아오지 않음. 이후 어둠의 땅이 서서히 커짐<\/td><\/tr><tr><td>맹약력 400~500년<\/td><td>마왕 벨제르크가 벨라드 고성에 군림했다는 소문이 퍼짐. 왕국들은 방벽을 세우고 북쪽을 포기<\/td><\/tr><tr><td>맹약력 600년경<\/td><td>방벽이 뚫리기 시작. 변이한 괴물들이 남쪽까지 내려옴<\/td><\/tr><tr><td><b>맹약력 612년 (현재)<\/b><\/td><td>로웬의 모험가 등록소에 새 모험가가 첫 등록을 함<\/td><\/tr><\/table><\/div>"], ["4. 세력", "<div class=\"wh\">4-1. 모험가 등록소 (시작 마을 로웬)<\/div><p class=\"wp\">대륙 전역의 모험가를 등록하고 구조 사제단과 기록을 관리하는 기관입니다. 의뢰가 끊긴 지 오래되어 지금의 의뢰 담당자는 \"지금은 맡길 일이 없다\"고 말합니다. (이유는 §8)<\/p><div class=\"wh\">4-2. 마을 사람들<\/div><div class=\"wl\">· <b>상인:<\/b> 북쪽 길이 막혀 물자가 귀해졌지만 아직 마을을 지키는 여행 상인.<\/div><div class=\"wl\">· <b>제작자:<\/b> 장비를 \"재련 의식\"으로 합칠 줄 아는 장인. 같은 격의 장비 다섯 개를 합치면 한 단계 위의 장비로 다시 태어납니다. 또한 전설급 무기 제작법을 아는 몇 안 되는 사람입니다.<\/div><div class=\"wl\">· <b>마법부여사:<\/b> 원소의 균열에서 새어 나온 부산물을 연구하는 학자. 장비 강화와 부여를 맡습니다.<\/div><div class=\"wl\">· <b>개인창고지기:<\/b> 로웬의 오래된 창고 길드. 믿을 수 있는 금고로 유명합니다.<\/div><div class=\"wl\">· <b>전직 교관:<\/b> 네 학파의 교관이 교대로 로웬에 파견되어 있습니다.<\/div><div class=\"wh\">4-3. 네 학파<\/div><div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>직업<\/th><th>학파(가안)<\/th><th>교관의 시험이 의미하는 것<\/th><\/tr><tr><td>전사<\/td><td>철벽의 맹세단<\/td><td>강한 상대와 정면으로 맞선 경험을 요구합니다<\/td><\/tr><tr><td>도적<\/td><td>그림자 조합<\/td><td>이름 있는 존재의 허점을 찾아낼 수 있는지 봅니다<\/td><\/tr><tr><td>마법사<\/td><td>원소의 탑<\/td><td>서로 다른 원소를 몸으로 아는지 확인합니다<\/td><\/tr><tr><td>성직자<\/td><td>새벽 교단<\/td><td>어둠을 걷어내는 일을 해 본 적이 있는지 봅니다. 교단의 사명은 어둠의 땅이 퍼지는 것을 막는 것입니다<\/td><\/tr><\/table><\/div><div class=\"wl\">· 도적의 <b>그림자 걸음<\/b>은 상대의 기세가 흐트러지는 한순간을 파고드는 기술입니다.<\/div><div class=\"wl\">· <b>죽음의 선고<\/b>(도적의 최고 비전)는 다섯 번의 급소 타격으로 \"죽음을 먼저 선고하는\" 기술입니다.<\/div>"], ["5. 지역 서사 (1막 · 필드 15곳)", "<p class=\"wp\">각 필드는 \"오염이 얼마나 진행되었는가\"를 한 줄로 보여줍니다. 남쪽은 그저 변이일 뿐이고, 북쪽으로 갈수록 이유가 있는 폭력이 됩니다.<\/p><div class=\"wh\">프리아 평원<\/div><div class=\"wl\">1. <b>초원 어귀<\/b> — 로웬 바로 옆. 해충과 작은 짐승만 나옵니다. 큰이빨 쥐왕 같은 이름난 존재는 \"작은 것들이 뭉친 이름\"에 불과합니다. 아직 오염의 기색은 없습니다.<\/div><div class=\"wl\">2. <b>황금 들판<\/b> — 추수철에 농장이 비는 일이 생겼습니다. 호박 유령과 허수아비 정령은 일하다 돌아오지 못한 농부들의 미련이 변한 것입니다. 추수왕 짚왕이 이 들판의 이름 있는 존재입니다.<\/div><div class=\"wl\">3. <b>고블린 구릉<\/b> — 고블린과 오크가 구릉을 점거했습니다. 이들은 오염으로 변한 것이 아니라 <b>북쪽에서 쫓겨 내려온 무리<\/b>입니다. \"북쪽에서 무언가 밀려오고 있다\"는 첫 단서입니다. (던전: 오크 요새)<\/div><div class=\"wh\">엘더 숲<\/div><div class=\"wl\">4. <b>푸른 숲 어귀<\/b> — 숲의 짐승들이 이유 없이 사나워졌습니다. 숲의 파수꾼 곰 그라우는 본래 숲을 지키던 수호 짐승입니다.<\/div><div class=\"wl\">5. <b>속삭이는 숲<\/b> — 나무들이 말을 겁니다. 영목들이 속삭이는 내용은 \"깨어나지 말라\"는 경고인데, 아직 누구도 알아듣지 못합니다. 달빛 구미호 루나는 이 숲의 오래된 이야기를 안다고 전해집니다.<\/div><div class=\"wl\">6. <b>고목의 심장부<\/b> — 숲의 중심. 불타는 엔트 이그니스와 샘물의 여왕 나이아스는 서로 반대되는 원소의 수호 존재가 한 숲에 갇힌 모습입니다. 원소의 균형이 무너지기 시작한 첫 증거입니다. (던전: 마녀의 지하 은신처 · 수정 호수 동굴이 가깝습니다)<\/div><div class=\"wh\">묵은 늪<\/div><div class=\"wl\">7. <b>안개 습지<\/b> — 안개 속에서 길을 잃은 상인의 영혼이 반딧불로 떠돕니다. 늪 유령 선장 마레는 배를 잃은 뱃사람의 이야기입니다.<\/div><div class=\"wl\">8. <b>썩은 수렁<\/b> — 독과 부패가 진해집니다. 늪 마녀들이 저주에 손을 대기 시작한 곳입니다. (던전: 가라앉은 사원)<\/div><div class=\"wl\">9. <b>저주받은 갈대밭<\/b> — 저주가 본격적으로 사람을 해칩니다. 저주 인형술사 바바야와 늪의 광신도 대주교 모르다는 \"이름을 가진 인간이 변한 존재\"의 첫 사례입니다. (던전: 역병 연금술사의 탑)<\/div><div class=\"wh\">철각 산맥<\/div><div class=\"wl\">10. <b>바위 고원<\/b> — 바람과 번개가 몰아치는 땅. 룬 드워프 장인왕 브론은 산맥의 마지막 드워프 왕으로, 자신들의 갱도에 무슨 일이 있었는지 알고 있습니다. (던전: 폭풍 매의 둥지)<\/div><div class=\"wl\">11. <b>광산 갱도<\/b> — 갱도에서 가스와 정전기가 샙니다. 드워프 광부들이 망령이 되어 일을 계속합니다. 암흑 광부왕 다크핸드가 이끕니다. (던전: 불타는 광산)<\/div><div class=\"wl\">12. <b>용의 능선<\/b> — 용의 시대 유적. 황금 용 아우룸은 옛 용 가운데 하나로, 모험가를 시험하는 듯한 태도를 보입니다. 용살자 망령대장 슬레이어는 <b>용을 쓰러뜨렸던 옛 영웅의 흔적<\/b>입니다.<\/div><div class=\"wh\">어둠의 땅<\/div><div class=\"wl\">13. <b>망자의 평원<\/b> — 첫 번째 모험가 원정대와 이후 모든 전사자가 잠든 땅. 해골 장군 스켈레투스는 <b>원정대의 부장<\/b>이었다는 전승이 있습니다. (던전: 타락한 대성당 · 망자의 지하묘지)<\/div><div class=\"wl\">14. <b>피의 성채 외곽<\/b> — 벨라드 고성의 외성. 흡혈귀와 피의 사도들이 지킵니다. 피 박쥐 공작 드라큘이 이 성채의 관리자입니다. (던전: 원소의 균열 신전은 이 땅의 끝, 마왕성 앞에 있습니다)<\/div><div class=\"wl\">15. <b>공허의 문턱<\/b> — 땅이 끝나는 곳. 공허의 눈과 촉수가 하늘과 땅을 구분 없이 덮습니다. <b>이곳의 괴물들은 기세가 요동치고 호흡이 어긋나는 기이한 싸움을 합니다.<\/b> 공허의 촉수 군주 크툴루스, 심연의 용 니드호그, 지옥 기수 헬라이더, 허공의 별빛 여왕 스텔라, 마계 용암 군주 볼케이노가 이곳의 이름 있는 존재들입니다.<\/div>"], ["6. 던전 서사 (1막 · 11곳)", "<div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>던전<\/th><th>설정(가안)<\/th><th>핵심 인물<\/th><\/tr><tr><td>오크 요새<\/td><td>북쪽에서 쫓겨난 오크 무리가 세운 임시 요새. 대족장 크라그는 무리를 지키려는 것뿐입니다.<\/td><td>철퇴의 우그라, 불꽃 주술사 샤르카, 대족장 크라그<\/td><\/tr><tr><td>폭풍 매의 둥지<\/td><td>번개가 끊이지 않는 절벽. 매들은 번개의 원소 균열 가까이에 둥지를 틀었습니다.<\/td><td>매 조련사 칼리온, 뇌운 마녀 세레나, 뇌조 군주 아르카<\/td><\/tr><tr><td>마녀의 지하 은신처<\/td><td>숲의 마녀들이 도망쳐 숨은 지하 동굴. 마녀 여왕 이스라는 이 땅의 저주 연구를 이끕니다.<\/td><td>독약 조제사 헤카, 거미 사제 아라크네, 마녀 여왕 이스라<\/td><\/tr><tr><td>수정 호수 동굴<\/td><td>물과 빛이 서로를 속이는 지하 호수. 수정 여왕 프리시아는 새어 나온 원소의 힘을 몸에 받아들였습니다.<\/td><td>수정 기사 리온, 호수의 인어 네레이아, 수정 여왕 프리시아<\/td><\/tr><tr><td>가라앉은 사원<\/td><td>맹약 이전의 늪 신을 모시던 사원. 대사제 말카는 신의 목소리를 들었다고 주장합니다.<\/td><td>악어 신관장 소베크, 익사한 신녀 탈리아, 심연의 대사제 말카<\/td><\/tr><tr><td>역병 연금술사의 탑<\/td><td>독을 연구하다 사람의 한계를 넘으려 한 연금술사들의 폐탑. 대연금술사 모르비드는 \"한계를 넘는 약\"을 만들려 했습니다.<\/td><td>실험체 제로, 부검의 크로우, 역병 대연금술사 모르비드<\/td><\/tr><tr><td>불타는 광산<\/td><td>드워프 광부들이 마지막으로 파던 광산. 용암 속에서 지금도 일이 계속되는 것은 <b>작업이 끝나지 않았다고 믿는 망령<\/b> 때문입니다.<\/td><td>용암 감독관 브룸, 철의 광부장 도르간, 화염 군주 이그나<\/td><\/tr><tr><td>타락한 대성당<\/td><td>새벽 교단의 옛 본산. 성스러운 빛이 일그러진 이유는 기도하던 이들이 <b>공허의 속삭임을 기도로 착각했기 때문<\/b>입니다.<\/td><td>타락 기사단장 알렉시스, 종탑 지기 콰지르, 타락 대주교 세라핀<\/td><\/tr><tr><td>망자의 지하묘지<\/td><td>첫 번째 원정대의 무덤. 죽음의 기사 하르겐은 원정대의 기사단장입니다. 해골 왕 오르곤은 그들을 이끌던 왕입니다.<\/td><td>죽음의 기사 하르겐, 대사서 네크로스, 해골 왕 오르곤<\/td><\/tr><tr><td>원소의 균열 신전<\/td><td>마왕성 앞. 여덟 원소가 새어 나오는 균열 위에 세워진 신전입니다. 수호자 이프리와 실피드는 균열을 막으려 애쓰다 변질되었습니다.<\/td><td>화염의 수호자 이프리, 폭풍의 수호자 실피드, 원소 군주 에테르온<\/td><\/tr><tr><td>마왕성<\/td><td>벨라드 고성. 1막의 종착점.<\/td><td>지옥 기사단장 모르가노, 공허의 총사령관 아제르, <b>마왕 벨제르크<\/b><\/td><\/tr><\/table><\/div>"], ["7. 핵심 인물", "<div class=\"wh\">마왕 벨제르크<\/div><p class=\"wp\">어둠의 끝에서 마지막 시련을 내는 마왕입니다. 정체는 §10에서 다룹니다. 1막 동안은 <b>\"왜 마왕이 모험가를 시험하는 듯 행동하는가\"<\/b> 라는 의문만 남깁니다. (그는 정면으로 맞서 싸웁니다. 기세를 흐트러뜨리는 공허의 괴물들과는 다릅니다.)<\/p><div class=\"wh\">공허의 총사령관 아제르<\/div><p class=\"wp\">마왕의 부하로 보이지만 실제로는 <b>마왕을 감시하는 존재<\/b>입니다. 마왕성의 사령관으로만 등장하며, 마왕을 대하는 태도가 어딘가 어색합니다. 2막의 핵심 복선입니다.<\/p><div class=\"wh\">첫 번째 원정대<\/div><p class=\"wp\">죽음의 기사 하르겐, 해골 장군 스켈레투스, 해골 왕 오르곤은 맹약력 300년 원정대의 일원이었습니다. 이들은 마왕에게 죽은 것이 아니라 <b>다른 이유로 죽었다<\/b>는 암시가 나옵니다. 원정대에는 마왕이 될 사람과, 대수림의 엘프 궁수도 있었다는 이야기가 전해집니다.<\/p><div class=\"wh\">전직 교관들과 마법부여사<\/div><p class=\"wp\">교관들은 제자에게 길을 가르치지만 <b>한계 너머는 가르치지 않습니다.<\/b> 이유를 물으면 말을 돌립니다.<\/p>"], ["8. 1막에서 이미 깔린 복선", "<div class=\"wl\">1. <b>\"사람의 길은 여섯 번째 문에서 끝난다\"는 교본<\/b> — 자연의 이치인가, 누군가의 선 긋기인가.<\/div><div class=\"wl\">2. <b>의뢰 담당자가 \"맡길 일이 없다\"고 말함<\/b> — 의뢰주인 마을 원로들이 모두 북쪽 방벽 근처로 불려 간 뒤 소식이 끊겼습니다. (2막에서 회수)<\/div><div class=\"wl\">3. <b>고블린 구릉의 오크와 고블린이 북쪽에서 쫓겨 왔다<\/b> — 오염이 아니라 무엇에 쫓긴 것인지.<\/div><div class=\"wl\">4. <b>원소의 균열 신전<\/b> — 맹약의 원소가 새고 있다는 직접적인 증거. 수호자들이 변질되어 있습니다.<\/div><div class=\"wl\">5. <b>공허의 문턱에서 기세가 요동침<\/b> — 공허는 맹약 바깥의 존재.<\/div><div class=\"wl\">6. <b>타락한 대성당과 역병 연금술사의 탑<\/b> — \"사람의 한계를 넘으려는\" 시도가 모두 파국으로 끝난 흔적. 한계 돌파가 왜 위험한지의 선행 사례입니다.<\/div><div class=\"wl\">7. <b>마왕의 행동 양식<\/b> — 시험하듯 싸우는 점.<\/div><div class=\"wl\">8. <b>몬스터가 가진 장비<\/b> — 원정대와 실종자의 물건이 섞여 있다는 사실.<\/div><div class=\"wl\">9. <b>마나 물약이 없다<\/b> — 사람의 몸에 마나라는 힘이 정식으로 부여된 적이 없다는 암시. 마법사들은 원소의 힘을 직접 빌려 쓸 뿐입니다.<\/div><div class=\"wl\">10. <b>도적의 최고 비전 운명의 지배<\/b> — 기세의 흐름을 비트는 힘이 존재한다는 것.<\/div>"], ["9. ⚠ 스포일러: 전체 이야기 구조", "<div class=\"wq\">아래는 모험가에게 처음부터 알려 주지 않는 내용입니다.<\/div><div class=\"wh\">제1막 「첫 번째 문」<\/div><div class=\"wl\">· 평범한 모험가가 로웬에서 출발해 북쪽으로 올라가며 오염의 근원을 따라 마왕성에 이릅니다.<\/div><div class=\"wl\">· 마왕 벨제르크를 쓰러뜨리면 마왕은 쓰러지기 직전 이렇게 말합니다. <b>\"겨우 여섯 번째 문이로군. 그래서야 문턱에도 못 닿는다.\"<\/b><\/div><div class=\"wl\">· 마왕의 인장이 남으면서 <b>일곱 번째 문의 윤곽<\/b>이 모험가의 눈에 보이지만 열리지 않습니다. 이것이 1막 마지막 장면입니다.<\/div><div class=\"wh\">제2막 「잊힌 원정대」 (대수림)<\/div><div class=\"wl\">· 첫 번째 원정대의 진실. 원정대는 <b>사람의 길의 끝을 넘으려 한 최초의 사람들<\/b>이었고, 그들이 만든 균열이 어둠의 땅의 시작입니다.<\/div><div class=\"wl\">· 마왕 벨제르크의 정체: 원정대의 마지막 생존자이자 <b>한계를 넘은 최초의 인간<\/b>. 맹약은 한계를 넘은 영혼을 \"이질\"로 판정해 공허의 접촉을 허용했고, 그는 균열이 퍼지지 않도록 스스로를 문으로 삼아 마왕의 자리에 앉았습니다.<\/div><div class=\"wl\">· 원정대의 또 다른 한 명, <b>엘프 궁수 실비엔(가안)<\/b>도 같은 마기에 물들어 대수림 깊은 곳에서 타락했습니다. 모험가는 그녀를 찾아 대수림으로 향합니다.<\/div><div class=\"wl\">· 마을 원로들이 사라진 이유와 아제르의 목적(공허가 마왕을 감시해 문이 닫히지 않도록 하는 것)이 드러납니다.<\/div><div class=\"wh\">제3막 「여덟 번째 수호자」<\/div><div class=\"wl\">· 여덟 원소에는 맹약 때 숨겨진 <b>아홉 번째 의지(맹약의 설계자)<\/b> 가 있었다는 사실. 사람의 길에 끝이 있는 것은 이 의지가 공허를 막기 위해 만든 <b>봉인의 눈금<\/b> 때문입니다.<\/div><div class=\"wl\">· 모험가는 한계를 넘는 대가(공허의 접촉)와 넘지 않는 대가(균열의 확대) 사이에서 선택해야 합니다.<\/div><div class=\"wh\">이후<\/div><div class=\"wl\">· 맹약의 바깥에 있는 존재와의 싸움, 맹약의 개정, 새로운 질서의 선택 등으로 이어집니다. (구체적 전개는 이후 결정)<\/div>"], ["10. 2막 — 대수림", "<p class=\"wp\">원정대의 엘프 궁수는 대수림의 수호자였습니다. 마기는 숲의 뿌리를 타고 퍼졌고, 숲의 정령과 짐승, 엘프 병사들이 차례로 오염되었습니다.<\/p><div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>필드<\/th><th>분위기<\/th><th>희귀 네임드 (3마리)<\/th><\/tr><tr><td>수림의 관문<\/td><td>대수림 입구. 엘프 국경<\/td><td>이끼 갑옷 거북왕 그라노 · 마기 사슴의 왕 에이크 · 수림 문지기 고목 우르드<\/td><\/tr><tr><td>은월의 숲<\/td><td>달빛이 뒤틀린 숲<\/td><td>월광 늑대 여왕 루나리스 · 은빛 일각수의 그림자 실바 · 달 사제 망령 세레느<\/td><\/tr><tr><td>가시 덩굴 미궁<\/td><td>독가시와 거미의 미로<\/td><td>가시 장미 여왕 로제 · 미궁의 거미 집정관 아라크 · 전격 덩굴 군주 쇼크로<\/td><\/tr><tr><td>세계수의 뿌리<\/td><td>오염된 수액이 흐르는 뿌리<\/td><td>뿌리 장로 엔트 이그라 · 수액의 정령왕 시럽 · 고대 수호 석인 가디언 골<\/td><\/tr><tr><td>타락한 성소<\/td><td>엘프의 마지막 기도처<\/td><td>불타는 성소 정령왕 이그니스 · 타락한 월광 대무녀 노바 · 검은 뿔 신수 루드라<\/td><\/tr><\/table><\/div><div style=\"overflow-x:auto\"><table class=\"wt\"><tr><th>던전<\/th><th>간부<\/th><th>보스<\/th><\/tr><tr><td>버려진 수호 초소<\/td><td>초소장 탈리온 · 마기 감시자 이실<\/td><td>부패한 수문장 가로스<\/td><\/tr><tr><td>월광 사원<\/td><td>월광 대사제 루네아 · 은빛 창기사 셀레닌<\/td><td>월식의 늑대왕 하티르<\/td><\/tr><tr><td>독가시 미궁의 심장<\/td><td>가시 여왕 로제니아 · 독 연금술사 벨라돈<\/td><td>식충화 여왕 라플로라<\/td><\/tr><tr><td>세계수 뿌리 동굴<\/td><td>뿌리 군주 이그드 · 수액 사제 타누<\/td><td>뿌리 수호룡 라타토<\/td><\/tr><tr><td>타락한 엘프 성소<\/td><td>타락 엘프 대마법사 아에린 · 엘프 근위대장 데일론<\/td><td><b>타락한 엘프 궁수 실비엔<\/b><\/td><\/tr><\/table><\/div>"], ["11. 마왕이 쓰러진 뒤 — 되살아나는 전설들", "<p class=\"wp\">마왕 벨제르크가 쓰러지자 그가 문이 되어 누르고 있던 마기가 한꺼번에 흘러넘쳤습니다. 이미 지나온 땅들이 <b>전보다 훨씬 짙은 마기에 잠기고<\/b>, 괴물들은 이전의 것과 비교할 수 없이 강해졌습니다. 모험가들은 이를 \"되살아난 땅\"이라 부릅니다.<\/p><div class=\"wl\">· 되살아난 땅에서는 순한 짐승들이 모두 사라지고, 이름난 괴물이 훨씬 자주 모습을 드러냅니다.<\/div><div class=\"wl\">· 이름난 괴물들의 인장을 모으면, 각 땅에 얽힌 <b>오래된 전설과 괴담<\/b>이 형체를 얻어 나타납니다. 쥐잡이 하멜린, 수확 여왕 케레스, 폭탄 광대 붐붐, 사계의 숲지기 시즌, 요정왕 퍽, 꿈꾸는 고목 모르페, 등불 도깨비 룩스, 수렁의 정원사 모르타, 그림자극 연출가 아르시노, 모루지기 토르가, 가스 카나리 카나, 용을 삼킨 소녀 드라코니아, 진혼곡 지휘자 레퀴엠, 성찬 신부 사크라, 문턱지기 무명이 그들입니다.<\/div><div class=\"wl\">· 되살아난 대수림은 아직 문이 열리지 않았습니다. (준비 중)<\/div>"], ["12. 전설의 무기 — 필살의 비수", "<p class=\"wp\">원소의 균열 신전의 괴물들이 이따금 떨어뜨리는 <b>그을린 의뢰서<\/b>는 이름을 잃은 대장장이가 남긴 마지막 주문서입니다. 의뢰서를 받아 든 모험가가 불의 시험을 통과해 불씨와 군주의 불꽃 파편, 원소 군주의 불꽃 열쇠를 모아 제작자에게 건네면, 이름 없는 대장장이의 유작 <b>필살의 비수<\/b>가 완성됩니다. 불을 먹고 자라는 칼날은 불길이 번질수록 더 크게 터집니다.<\/p>"]];

var P_SIG=()=>JSON.stringify([P.lv,P.exp,P.gold,(P.gear||[]).length]),P_T0=P_SIG(); // 열릴 때의 기록 서명: 이 기기를 처음 연결할 때 기록이 손대지 않은 상태인지 판단
showTitle(false);

// ===== ☁ 클라우드 동기화 (GitHub 비공개 Gist) =====
// 기기마다 접속 토큰(gist 권한)을 한 번만 붙여 넣으면, 저장할 때마다 자동으로 올리고 게임을 열 때 더 최신 기록이 있으면 불러온다. 기록은 비공개 Gist "rpg4-save" 하나에 들어간다.
// last = 마지막으로 서로 맞춘 시각(P.sv). 로컬이 last 이후로 안 바뀌었으면 클라우드 최신본을 자동으로 받고, 양쪽이 다 바뀌었거나(충돌) 이 기기를 처음 연결할 때 기존 기록이 있으면 어느 쪽을 쓸지 묻는다.
const CLK="rpg4cloud",GAPI="https://api.github.com",GDESC="rpg4-save",GFILE="rpg4-save.json";
var CL=(()=>{try{return JSON.parse(localStorage.getItem(CLK))||{}}catch(e){return{}}})();var clTm=null,clBusy=false,clMsg="";
const clSave=()=>{try{localStorage.setItem(CLK,JSON.stringify(CL))}catch(e){}};
const clH=()=>({Authorization:"Bearer "+CL.tok,Accept:"application/vnd.github+json","Content-Type":"application/json"});
const clApi=async(path,opt)=>{const r=await fetch(GAPI+path,{...opt,headers:clH()});if(!r.ok){const e=new Error(r.status===401?"토큰이 올바르지 않습니다.":r.status===403||r.status===404?"토큰 권한(gist)을 확인하세요.":"서버 오류 ("+r.status+")");e.code=r.status;throw e}return r.json()};
async function clFind(){if(CL.gid)return CL.gid;const l=await clApi("/gists?per_page=100");const g=l.find(x=>x.description===GDESC&&x.files&&x.files[GFILE]);if(g){CL.gid=g.id;clSave();return g.id}return null}
async function clGet(){const id=await clFind();if(!id)return null;const g=await clApi("/gists/"+id),f=g.files&&g.files[GFILE];if(!f)return null;let c=f.content;if(f.truncated||c==null){const r=await fetch(f.raw_url);c=await r.text()}return JSON.parse(c)}
async function clPut(){const t=P.sv||Date.now(),body=JSON.stringify({t,d:JSON.stringify(P)}),id=await clFind();if(id)await clApi("/gists/"+id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:body}}})});else{const g=await clApi("/gists",{method:"POST",body:JSON.stringify({description:GDESC,public:false,files:{[GFILE]:{content:body}}})});CL.gid=g.id}CL.last=t;CL.at=Date.now();clSave();return t}
const clStat=()=>!CL.tok?"":clMsg||(CL.at?`☁ 동기화됨 ${new Date(CL.at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}`:"☁ 연결됨");
function clUpd(){const e=document.getElementById("cl-st");if(e)e.textContent=clStat();const t=document.getElementById("tt-cs");if(t)t.textContent=clStat()}
function cloudSoon(){if(!CL||!CL.tok||CL.off)return;clearTimeout(clTm);clTm=setTimeout(clUp,8000)}
// 올리기 전에 클라우드에 더 최신 기록이 있는지 확인한다 — 있으면 덮어쓰지 않고 어느 쪽을 쓸지 묻는다(오래된 기기가 최신 기록을 덮어쓰는 사고 방지)
async function clUp(){if(!CL.tok||clBusy)return;clBusy=true;clMsg="☁ 올리는 중…";clUpd();try{const r=await clGet();if(r&&r.t!==CL.last&&r.t>(CL.last||0)){clMsg="⚠ 클라우드에 더 최신 기록이 있어 올리지 않았습니다.";clAsk(r)}else{await clPut();clMsg=""}}catch(e){clMsg="⚠ 동기화 실패: "+(e.message||"네트워크 오류")}clBusy=false;clUpd()}
const clApply=r=>{try{localStorage.setItem("rpg4",r.d);localStorage.setItem("rpg4n","1");CL.last=r.t;CL.at=Date.now();clSave();location.reload()}catch(e){clMsg="⚠ 불러오지 못했습니다.";clUpd()}};
const clBar=(txt,btns)=>{const o=document.getElementById("cldb");o&&o.remove();const d=document.createElement("div");d.id="cldb";d.innerHTML=`<span>${txt}</span>`;btns.forEach(([l,fn])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>{d.remove();fn()};d.append(b)});document.body.append(d)};
// 게임을 열 때 한 번: 클라우드 기록과 비교
// 저장 슬롯 동기화: 슬롯 5칸을 Gist의 별도 파일(rpg4-slots.json)로 주고받는다. 칸마다 저장·삭제 시각을 비교해 더 최근 쪽이 이긴다(삭제는 흔적(tombstone)으로 전달)
const GSLOT="rpg4-slots.json";var SLB=false;
const slRdLocal=i=>{try{return JSON.parse(localStorage.getItem("rpg4slot"+i))}catch(e){return null}};
function slDel(){try{return JSON.parse(localStorage.getItem("rpg4slotdel"))||{}}catch(e){return{}}}
function slDelSet(o){try{localStorage.setItem("rpg4slotdel",JSON.stringify(o))}catch(e){}}
async function clSlots(){if(!CL||!CL.tok||CL.off||SLB)return false;SLB=true;let ok=true;
 try{const id=await clFind();let rs={};
  if(id){const g=await clApi("/gists/"+id),f=g.files&&g.files[GSLOT];if(f){let c=f.content;if(f.truncated||c==null)c=await(await fetch(f.raw_url)).text();rs=JSON.parse(c)||{}}}
  const dl=slDel();let up=false;
  for(let i=1;i<=5;i++){const lo=slRdLocal(i),lt=Math.max(lo?lo.t:0,dl[i]||0),re=rs[i],rt=re?re.t:0;
   if(rt>lt){if(re.del){try{localStorage.removeItem("rpg4slot"+i)}catch(e){}dl[i]=re.t}else{localStorage.setItem("rpg4slot"+i,JSON.stringify(re));delete dl[i]}}
   else if(lt>rt){if((dl[i]||0)>(lo?lo.t:0)){rs[i]={t:dl[i],del:1}}else{rs[i]=lo;delete dl[i]}up=true}}
  slDelSet(dl);
  if(up){const body=JSON.stringify(rs);let gid=id;if(!gid){await clPut();gid=CL.gid}await clApi("/gists/"+gid,{method:"PATCH",body:JSON.stringify({files:{[GSLOT]:{content:body}}})})}
 }catch(e){ok=false;clMsg="⚠ 슬롯 동기화 실패: "+(e.message||"네트워크 오류");clUpd()}
 SLB=false;return ok}
async function clCheck(){if(!CL.tok||CL.off)return;clSlots();clMsg="☁ 확인 중…";clUpd();let r;try{r=await clGet()}catch(e){clMsg="⚠ 동기화 실패: "+(e.message||"네트워크 오류");clUpd();return}clMsg="";
 const loc=P.sv||0,last=CL.last||0;
 if(!r){clUp();return}
 if(r.t===last){if(loc>last)clUp();else{CL.at=Date.now();clSave()}clUpd();return}
 const rm=(()=>{try{const q=JSON.parse(r.d);return`Lv ${q.lv} · ${new Date(r.t).toLocaleString("ko-KR")}`}catch(e){return""}})();
 if(r.t>last&&((last>0&&loc<=last)||(last===0&&(fresh||(NOLOC&&P_SIG()===P_T0))))){clBar(`☁ 클라우드의 최신 기록을 불러옵니다 (${rm})`,[]);setTimeout(()=>clApply(r),700);return}
 clAsk(r);clUpd()}
function clAsk(r){const rm=(()=>{try{const q=JSON.parse(r.d);return`Lv ${q.lv} · ${new Date(r.t).toLocaleString("ko-KR")}`}catch(e){return""}})();clBar(`☁ 클라우드에 다른 기록이 있습니다 (${rm}). 이 기기 기록: Lv ${P.lv}`,[["☁ 기록 불러오기",()=>clApply(r)],["이 기기 기록으로 덮어쓰기",()=>{CL.last=r.t;clSave();clUp()}],["나중에",()=>{CL.off=1;clSave();clMsg="⚠ 동기화 보류 중 (⚙ → 클라우드 동기화에서 다시 켤 수 있음)";clUpd()}]])}
function showCloud(){if(document.getElementById("cld"))return;const o=document.createElement("div");o.id="cld";
 const linked=!!CL.tok;o.innerHTML=`<div class="bx"><h3>☁ 클라우드 동기화</h3><div class="hp">PC와 모바일에서 같은 기록을 이어서 하는 기능입니다. <b>GitHub 계정</b>이 필요하고, 기기마다 토큰을 한 번만 붙여 넣으면 됩니다. 기록은 내 계정의 <b>비공개</b> Gist(rpg4-save)에 저장됩니다.</div>
 <div class="hp"><b>토큰 만들기</b>: GitHub → Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b> → Generate new token → 권한은 <b>gist</b>만 체크 → 만들어진 토큰(ghp_…)을 복사.</div>
 <input id="cl-tok" type="password" placeholder="GitHub 토큰 (ghp_…)" autocomplete="off" value="${linked?"••••••••••••":""}">
 <button class="pr" id="cl-go">${linked?"토큰 다시 연결":"연결하고 동기화 시작"}</button>
 ${linked?`<button id="cl-up">⬆ 지금 올리기</button><button id="cl-dn">⬇ 지금 내려받기</button><button id="cl-off">연결 해제 (이 기기에서 토큰 삭제)</button>`:""}
 <div class="st" id="cl-st">${clStat()}</div><button id="cl-x">닫기</button></div>`;document.body.append(o);
 const q=i=>document.getElementById(i),say2=(t,ok)=>{const e=q("cl-st");e.style.color=ok?"#7fe3a8":"#ff9a8a";e.textContent=t};
 q("cl-x").onclick=()=>o.remove();
 q("cl-go").onclick=async()=>{const v=q("cl-tok").value.trim();if(!v||/^•+$/.test(v))return say2("토큰을 입력하세요.");CL={tok:v};clSave();say2("연결 확인 중…",1);try{const u=await clApi("/user");const r=await clGet();CL.at=Date.now();clSave();say2(`✔ ${u.login} 계정으로 연결했습니다.`,1);o.remove();if(!r)await clUp();else await clCheck()}catch(e){CL={};clSave();say2("❌ "+(e.message||"연결하지 못했습니다."))}};
 if(linked){q("cl-up").onclick=async()=>{say2("올리는 중…",1);try{const r=await clGet();if(r&&r.t>(CL.last||0)&&!confirm("클라우드에 더 최신 기록이 있습니다. 이 기기 기록으로 덮어쓸까요?\n(취소하면 올리지 않습니다)"))return say2("올리지 않았습니다.");delete CL.off;await clPut();say2("✔ 올렸습니다.",1)}catch(e){say2("❌ "+e.message)}};
  q("cl-dn").onclick=async()=>{say2("받는 중…",1);try{const r=await clGet();if(!r)return say2("클라우드에 저장된 기록이 없습니다.");if(confirm("이 기기의 현재 기록이 클라우드 기록으로 바뀝니다. 계속할까요?"))clApply(r)}catch(e){say2("❌ "+e.message)}};
  q("cl-off").onclick=()=>{CL={};clSave();o.remove();clUpd()}}}
clCheck();
// 인게임 설정(우측 상단 ⚙): 세로 메뉴 — 시작화면(게임 시작 화면으로 돌아감. 진행 상태는 그대로 두고 이어하기로 복귀)
{const sm=$("setm");$("b-set").onclick=e=>{e.stopPropagation();sm.style.display=sm.style.display==="flex"?"none":"flex"};document.addEventListener("click",e=>{if(!e.target.closest("#setm,#b-set"))sm.style.display="none"});$("m-title").onclick=()=>{sm.style.display="none";showTitle(true)};$("m-cloud").onclick=()=>{sm.style.display="none";showCloud()}}
</script></body></html>
